<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель | Ibrohim.dev</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><style>
.admin-main{max-width:1120px;margin:65px auto 100px;padding:0 22px}.admin-main h1{font-size:clamp(40px,7vw,76px);margin:14px 0}.admin-panel{padding:clamp(18px,4vw,32px);border:1px solid #ffffff20;border-radius:22px;background:#ffffff08;margin:24px 0}.admin-login input{display:block;width:min(100%,420px);padding:15px;margin:15px 0;background:#171b18;border:1px solid #ffffff30;border-radius:10px;color:white}.admin-login button,.admin-toolbar button{padding:13px 18px;border:0;border-radius:10px;cursor:pointer}.admin-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.admin-toolbar button{background:#b7f36b;color:#10140e}.admin-toolbar button.secondary{background:#333;color:white}.admin-order{border:1px solid #ffffff20;border-radius:16px;padding:20px;margin:15px 0;overflow-wrap:anywhere}.admin-order h3{margin:0 0 10px}.admin-meta{display:flex;gap:15px;flex-wrap:wrap;opacity:.8;font-size:13px}.admin-order select{padding:10px;border-radius:9px;background:#171b18;color:white;border:1px solid #ffffff40}.admin-error{color:#ff9292}.admin-hidden{display:none!important}.admin-order p{white-space:pre-wrap}.admin-order a{color:#b7f36b}
</style></head><body><div class="glow"></div><header><a class="logo" href="index.html"><b>IF</b> IBROHIM<span>.DEV</span></a><nav><a href="index.html">На сайт</a><a href="order.html">Заказать сайт</a></nav></header><main class="admin-main"><p class="mono">PRIVATE AREA / ADMIN</p><h1>Панель <i>заказов.</i></h1><section id="login" class="admin-panel admin-login"><h2>Вход администратора</h2><form id="loginForm"><input name="password" type="password" required placeholder="Пароль администратора"><button class="primary">Войти ↗</button></form><p id="loginMessage" class="admin-error" role="status"></p></section><section id="dashboard" class="admin-hidden"><div class="admin-panel admin-toolbar"><b id="count">0 заявок</b><button id="refresh">Обновить</button><button id="logout" class="secondary">Выйти</button></div><div id="orders"></div></section></main><script>
const $=s=>document.querySelector(s),login=$('#login'),dash=$('#dashboard');function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const r=await fetch('/api/admin/orders');if(r.status===401){login.classList.remove('admin-hidden');dash.classList.add('admin-hidden');return}const d=await r.json();if(!r.ok)throw Error(d.message||'Ошибка');login.classList.add('admin-hidden');dash.classList.remove('admin-hidden');$('#count').textContent=`Заявок: ${d.orders.length}`;$('#orders').innerHTML=d.orders.map(o=>`<article class="admin-order"><h3>${esc(o.name)} — ${esc(o.type)}</h3><div class="admin-meta"><span>📞 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></span><span>✈️ ${esc(o.telegram||'Telegram не указан')}</span><span>🕒 ${new Date(o.createdAt).toLocaleString('ru-RU')}</span></div><p>${esc(o.description)}</p><p>Бюджет: ${esc(o.budget)}</p><label>Статус: <select data-order="${esc(o.id)}" data-previous="${esc(o.status||'Новая')}"><option ${o.status==='Новая'?'selected':''}>Новая</option><option ${o.status==='В работе'?'selected':''}>В работе</option><option ${o.status==='Завершена'?'selected':''}>Завершена</option></select></label></article>`).join('')||'<p>Заявок пока нет.</p>';document.querySelectorAll('[data-order]').forEach(sel=>sel.addEventListener('change',async()=>{
  const previous=sel.dataset.previous||'Новая'; sel.disabled=true;
  try {
    const r=await fetch('/api/admin/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:sel.dataset.order,status:sel.value})});
    const data=await r.json().catch(()=>({})); if(!r.ok) throw Error(data.message||'Не удалось обновить статус');
    sel.dataset.previous=sel.value; sel.title='Статус сохранён';
  } catch(error) { sel.value=previous; alert(error.message); }
  finally { sel.disabled=false; }
}));}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const password=new FormData(e.target).get('password');const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const d=await r.json();$('#loginMessage').textContent=d.message||'';if(r.ok)load().catch(err=>$('#loginMessage').textContent=err.message)});$('#refresh').onclick=()=>load().catch(e=>alert(e.message));$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});load()};load().catch(e=>$('#loginMessage').textContent=e.message);
</script></body></html>
